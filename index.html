<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>影游生成器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 启动画面 -->
<div id="start-screen" class="screen active">
  <div class="start-content">
    <h1 class="glitch" data-text="影游生成器">影游生成器</h1>
    <p class="subtitle">AI 驱动 · 互动叙事</p>
    
    <div class="genre-select">
      <button class="genre-btn" data-genre="科幻" data-desc="星际航行、AI觉醒、末日求生">🚀 科幻</button>
      <button class="genre-btn" data-genre="悬疑" data-desc="密室逃脱、案件调查、心理惊悚">🔍 悬疑</button>
      <button class="genre-btn" data-genre="古风" data-desc="江湖恩怨、宫廷权谋、修仙问道">⚔️ 古风</button>
      <button class="genre-btn" data-genre="恋爱" data-desc="校园邂逅、都市情缘、前世今生">💕 恋爱</button>
      <button class="genre-btn" data-genre="恐怖" data-desc="鬼屋探险、都市传说、灵异事件">👻 恐怖</button>
      <button class="genre-btn" data-genre="自由" data-desc="输入你想要的任何主题">✨ 自定义</button>
    </div>

    <div id="custom-theme" class="hidden">
      <input type="text" id="theme-input" placeholder="输入你的主题，如：在末日废墟中寻找失落的记忆..." />
    </div>

    <button id="start-btn" class="start-btn" disabled>开始冒险</button>
  </div>
</div>

<!-- 游戏画面 -->
<div id="game-screen" class="screen">
  <div class="game-container">
    <!-- 场景图 -->
    <div id="scene-image" class="scene-image">
      <div class="scene-overlay"></div>
    </div>

    <!-- 剧情文字 -->
    <div id="story-panel" class="story-panel">
      <div id="scene-title" class="scene-title"></div>
      <div id="story-text" class="story-text"></div>
      <div id="choices" class="choices"></div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span id="chapter-info">第1章</span>
      <span id="choice-count">选择: 0</span>
      <button id="restart-btn" class="restart-btn">⟳ 重新开始</button>
    </div>
  </div>
</div>

<!-- 加载画面 -->
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-spinner"></div>
  <p id="loading-text">AI 正在编织故事...</p>
</div>

<!-- 结局画面 -->
<div id="ending-screen" class="screen">
  <div class="ending-content">
    <h2 id="ending-title">故事结束</h2>
    <div id="ending-text" class="ending-text"></div>
    <div class="ending-stats">
      <p>你做出了 <span id="total-choices">0</span> 个选择</p>
      <p id="ending-type"></p>
    </div>
    <button id="replay-btn" class="start-btn">再来一次</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
